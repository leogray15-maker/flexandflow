<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="/images/logo-mark.png" />
  <title>Flex &amp; Flow — Studio CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root{
      --cream:#f6f1ea; --white:#fffdfa; --charcoal:#2c2a27; --charcoal-soft:#4a4742;
      --muted:#7c766c; --sage:#8a9a7b; --sage-dark:#6f7e62; --terracotta:#c08457; --gold:#c9a24b;
      --sand:#e4d8c7; --radius:14px; --shadow:0 10px 30px rgba(44,42,39,.10);
      --font-serif:"Cormorant Garamond",Georgia,serif; --font-sans:"Jost",system-ui,sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--font-sans);font-weight:300;background:var(--cream);color:var(--charcoal-soft);line-height:1.6;-webkit-font-smoothing:antialiased}
    h1,h2,h3,h4{font-family:var(--font-serif);color:var(--charcoal);line-height:1.1;font-weight:600}
    button{font-family:var(--font-sans);cursor:pointer}
    .hidden{display:none!important}

    /* ---- Top bar ---- */
    .topbar{background:var(--charcoal);color:var(--cream);padding:16px 0}
    .wrap{width:100%;max-width:1080px;margin:0 auto;padding:0 22px}
    .topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px}
    .brand{display:flex;align-items:center;gap:12px}
    .brand .mark{width:38px;height:38px;border-radius:50%;background:var(--gold);color:var(--charcoal);display:grid;place-items:center;font-family:var(--font-serif);font-weight:700}
    .brand .name{font-family:var(--font-serif);font-size:1.3rem;color:var(--white)}
    .mark-img{width:42px;height:42px;object-fit:contain;display:block}
    .mark-img-lg{width:72px;height:72px;margin:0 auto 14px}
    .brand .name small{display:block;font-family:var(--font-sans);font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:500}
    .logout{background:transparent;border:1px solid rgba(255,253,250,.3);color:var(--cream);padding:8px 18px;border-radius:50px;font-size:.85rem;transition:.25s}
    .logout:hover{background:var(--cream);color:var(--charcoal)}

    /* ---- Login ---- */
    .login-screen{min-height:100vh;display:grid;place-items:center;padding:24px}
    .login-card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:44px 38px;max-width:400px;width:100%;text-align:center}
    .login-card .mark{width:54px;height:54px;border-radius:50%;background:var(--charcoal);color:var(--cream);display:grid;place-items:center;font-family:var(--font-serif);font-weight:700;font-size:1.2rem;margin:0 auto 18px}
    .login-card h1{font-size:1.9rem;margin-bottom:6px}
    .login-card p.sub{color:var(--muted);font-size:.95rem;margin-bottom:26px}
    .btn{display:inline-block;width:100%;background:var(--charcoal);color:var(--cream);border:1.5px solid var(--charcoal);border-radius:50px;padding:14px 24px;font-size:.95rem;font-weight:500;letter-spacing:.03em;transition:.25s}
    .btn:hover:not(:disabled){background:var(--sage-dark);border-color:var(--sage-dark);transform:translateY(-2px)}
    .btn:disabled{opacity:.55;cursor:not-allowed}
    .btn-ghost{background:transparent;color:var(--charcoal);border-color:var(--sand)}
    .btn-ghost:hover:not(:disabled){background:var(--charcoal);color:var(--cream)}
    .text-input{width:100%;font-size:1rem;font-family:var(--font-sans);padding:13px 16px;border:1.5px solid var(--sand);border-radius:12px;background:var(--cream);color:var(--charcoal);margin-bottom:14px}
    .text-input:focus{outline:none;border-color:var(--sage);background:var(--white)}
    .pw-wrap{position:relative;margin-bottom:14px}
    .pw-wrap .text-input{margin-bottom:0;padding-right:70px}
    .pw-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--sage-dark);font-size:.82rem;font-weight:500;padding:8px 10px;cursor:pointer}
    .login-step{margin-top:4px}
    .msg{font-size:.9rem;margin-top:14px;min-height:1.2em}
    .msg.error{color:var(--terracotta)}
    .msg.success{color:var(--sage-dark)}
    .linkish{background:none;border:none;color:var(--muted);font-size:.85rem;text-decoration:underline;margin-top:16px}

    /* ---- Dashboard ---- */
    main{padding:34px 0 70px}
    .page-head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:24px}
    .page-head h1{font-size:2.1rem}
    .page-head p{color:var(--muted);font-size:.92rem}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
    .stat{background:var(--white);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
    .stat .num{font-family:var(--font-serif);font-size:2rem;color:var(--charcoal);line-height:1}
    .stat .lbl{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:6px}
    .stat.new .num{color:var(--terracotta)}

    .toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:22px}
    .tabs{display:flex;gap:8px;flex-wrap:wrap}
    .tab{background:var(--white);border:1.5px solid transparent;color:var(--charcoal-soft);padding:8px 18px;border-radius:50px;font-size:.85rem;transition:.2s}
    .tab.active{background:var(--charcoal);color:var(--cream)}
    .tab:hover:not(.active){border-color:var(--sand)}
    .search{padding:10px 16px;border:1.5px solid var(--sand);border-radius:50px;background:var(--white);font-family:var(--font-sans);font-size:.9rem;min-width:200px;color:var(--charcoal)}
    .search:focus{outline:none;border-color:var(--sage)}

    .list{display:flex;flex-direction:column;gap:16px}
    .card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 24px;border-left:4px solid var(--sand)}
    .card.new{border-left-color:var(--terracotta)}
    .card.contacted{border-left-color:var(--sage)}
    .card.archived{opacity:.7;border-left-color:var(--muted)}
    .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
    .card-name{font-family:var(--font-serif);font-size:1.35rem;color:var(--charcoal)}
    .card-email{font-size:.88rem}
    .card-email a{color:var(--sage-dark)}
    .card-meta{text-align:right}
    .badge{display:inline-block;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600;padding:4px 12px;border-radius:50px}
    .badge.new{background:#f4e2d6;color:#a85e2e}
    .badge.contacted{background:#e3ead9;color:var(--sage-dark)}
    .badge.archived{background:#e7e3dc;color:var(--muted)}
    .card-date{font-size:.78rem;color:var(--muted);margin-top:6px}
    .card-msg{margin:16px 0;color:var(--charcoal-soft);white-space:pre-wrap;background:var(--cream);padding:14px 16px;border-radius:10px;font-size:.95rem}
    .actions{display:flex;gap:8px;flex-wrap:wrap}
    .act{font-size:.8rem;padding:7px 14px;border-radius:50px;border:1.5px solid var(--sand);background:var(--white);color:var(--charcoal-soft);transition:.2s}
    .act:hover{border-color:var(--charcoal);color:var(--charcoal)}
    .act.primary{background:var(--sage-dark);border-color:var(--sage-dark);color:var(--white)}
    .act.primary:hover{background:var(--charcoal);border-color:var(--charcoal)}
    .act.danger:hover{border-color:var(--terracotta);color:var(--terracotta)}
    .empty{text-align:center;padding:60px 20px;color:var(--muted)}
    .empty h3{font-size:1.5rem;color:var(--charcoal);margin-bottom:8px}

    @media(max-width:680px){
      .stats{grid-template-columns:repeat(2,1fr)}
      .search{flex:1;min-width:0}
    }
  </style>
</head>
<body>

  <!-- ============ LOGIN ============ -->
  <section id="login" class="login-screen">
    <div class="login-card">
      <img src="/images/logo-mark.png" alt="Flex &amp; Flow" class="mark-img mark-img-lg" />
      <h1>Studio CRM</h1>
      <p class="sub">Sign in to view your enquiries</p>

      <form id="loginForm" class="login-step">
        <input id="username" class="text-input" placeholder="Username" autocomplete="username" autocapitalize="none" />
        <div class="pw-wrap">
          <input id="password" class="text-input" type="password" placeholder="Password" autocomplete="current-password" />
          <button type="button" id="togglePw" class="pw-toggle" aria-label="Show password">Show</button>
        </div>
        <button id="loginBtn" type="submit" class="btn">Sign in</button>
      </form>

      <p id="loginMsg" class="msg" role="status" aria-live="polite"></p>
    </div>
  </section>

  <!-- ============ DASHBOARD ============ -->
  <div id="app" class="hidden">
    <header class="topbar">
      <div class="wrap">
        <div class="brand">
          <img src="/images/logo-mark.png" alt="Flex &amp; Flow" class="mark-img" />
          <div class="name">Flex &amp; Flow<small>Studio CRM</small></div>
        </div>
        <button id="logoutBtn" class="logout">Log out</button>
      </div>
    </header>

    <main class="wrap">
      <div class="page-head">
        <div>
          <h1>Enquiries</h1>
          <p>Messages sent through your website's contact form.</p>
        </div>
        <button id="refreshBtn" class="act">↻ Refresh</button>
      </div>

      <div class="stats">
        <div class="stat new"><div class="num" id="statNew">0</div><div class="lbl">New</div></div>
        <div class="stat"><div class="num" id="statContacted">0</div><div class="lbl">Contacted</div></div>
        <div class="stat"><div class="num" id="statArchived">0</div><div class="lbl">Archived</div></div>
        <div class="stat"><div class="num" id="statTotal">0</div><div class="lbl">Total</div></div>
      </div>

      <div class="toolbar">
        <div class="tabs">
          <button class="tab active" data-filter="all">All</button>
          <button class="tab" data-filter="new">New</button>
          <button class="tab" data-filter="contacted">Contacted</button>
          <button class="tab" data-filter="archived">Archived</button>
        </div>
        <input id="search" class="search" type="search" placeholder="Search name, email or message…" />
      </div>

      <div id="list" class="list"></div>
    </main>
  </div>

  <script src="/admin/app.js"></script>
</body>
</html>
